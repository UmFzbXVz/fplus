<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Folketidende</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="#" id="homeLink">Folketidende <span>Plus</span></a>
    </div>
  </header>

  <section class="controls" aria-label="Hent artikel">
    <div class="row">
      <input id="articleUrl" type="url" placeholder="https://www.folketidende.dk/..." autocomplete="url">
      <button id="loadButton" type="button">Hent</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </section>

  <main id="article" class="article">
    <div class="placeholder">Indlæser seneste artikler…</div>
  </main>

  <script src="app.js"></script>
</body>
</html>
